# ==============================================================================
# Configuración Nginx para Cosmos (API Node.js + Web Wizard)
# Despliegue en Sandbox TrueNAS SCALE (Debian 12 LXC)
# Ruta del archivo en Sandbox: /etc/nginx/sites-available/cosmos.rarabala.com
# Enlace simbólico: ln -s /etc/nginx/sites-available/cosmos.rarabala.com /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 8080;
    listen [::]:8080;

    # Dominio asignado en Cloudflare Tunnel
    server_name cosmos.rarabala.com;

    # Compresión Gzip para optimizar transferencia de JSON y recursos estáticos
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy hacia el servicio Node.js en puerto 3002
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloquear acceso a archivos y carpetas ocultas (.git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
